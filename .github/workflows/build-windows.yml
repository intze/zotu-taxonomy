name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VSEARCH_VERSION: "2.30.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyinstaller openpyxl

      - name: Build ZotuTaxonomy.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name ZotuTaxonomy zotu_gui.py

      - name: Bundle vsearch, README and example
        shell: pwsh
        run: |
          $v = "${{ env.VSEARCH_VERSION }}"
          Invoke-WebRequest "https://github.com/torognes/vsearch/releases/download/v$v/vsearch-$v-win-x86_64.zip" -OutFile vsearch.zip
          New-Item -ItemType Directory -Force -Path dist\tools | Out-Null
          Expand-Archive vsearch.zip -DestinationPath dist\tools
          Copy-Item README.md dist\
          Copy-Item tests\example_zotus.fasta dist\

      - name: Self-test the packaged app (downloads the NCBI database)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ZotuTaxonomy.exe `
                 -ArgumentList "--selftest", "dist\example_zotus.fasta", "selftest.xlsx" `
                 -Wait -PassThru
          Get-Content selftest.xlsx.log
          if ($p.ExitCode -ne 0) { throw "self-test exited with $($p.ExitCode)" }
          if (-not (Test-Path selftest.xlsx)) { throw "no Excel output" }
          if (-not (Select-String -Path selftest.xlsx.log -Pattern "Summary: .*Species: [1-9]" -Quiet)) { throw "unexpected classification" }
          # do not ship the database downloaded during the test; users get a fresh copy
          Remove-Item -Recurse -Force dist\db

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath ZotuTaxonomy-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ZotuTaxonomy-windows
          path: ZotuTaxonomy-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ZotuTaxonomy-windows.zip --title "ZotuTaxonomy ${{ github.ref_name }}" --notes "Windows build. Download ZotuTaxonomy-windows.zip, unzip, run ZotuTaxonomy.exe."
